name: Nightly Django test

on:
  schedule:
    - cron: "15 1 * * *"

  workflow_dispatch:

jobs:
  nightly-test:
    # Cannot check the existence of secrets, so limiting to repository name to prevent all forks to run nightly.
    # See: https://github.com/actions/runner/issues/520
    if: ${{ github.repository == 'wagtail/django-modelsearch' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg>=3.3"
          pip install "git+https://github.com/django/django.git@main#egg=Django"
          pip install -e .[test]
      - name: Test
        id: test
        continue-on-error: true
        run: |
          DATABASE_URL="sqlite:///test_modelsearch.sqlite" python ./runtests.py --backend db && DATABASE_URL="postgresql://user:password@localhost:5432/testdb" python ./runtests.py --backend db

      - name: Send Slack notification on failure
        if: steps.test.outcome == 'failure'
        run: |
          pip install "requests"
          python .github/report_nightly_build_failure.py
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
